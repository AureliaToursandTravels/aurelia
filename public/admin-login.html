<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelia Tours & Travels Admin Login</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-xl shadow-md max-w-sm w-full border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">Aurelia Tours &amp; Travels</h1>
    <p class="text-xs text-slate-400 text-center mb-6">Admin Panel</p>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
        <input type="text" id="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <button type="submit" class="w-full bg-[#0b2b5c] text-white font-bold py-2 rounded-lg hover:opacity-90">Login</button>
      <p id="err" class="text-red-500 text-xs text-center hidden"></p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('aurelia_token', data.token);
        // This page lives at /<secret-path>/login — admin panel is at /<secret-path>
        const base = window.location.pathname.replace(/\/login\/?$/, '') || '/';
        window.location.href = base;
      } else {
        const err = document.getElementById('err');
        err.innerText = data.error;
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
